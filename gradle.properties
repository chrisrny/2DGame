# Pas de démon Gradle persistant : évite d'accumuler des processus qui consomment de la RAM.
org.gradle.daemon=false
# Mémoire de Gradle et encodage UTF-8 partout (accents dans le code et la Javadoc).
org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
org.gradle.configureondemand=false

# Versions utilisées par les build.gradle des modules.
gdxVersion=1.14.2
lwjgl3Version=3.4.3
junitVersion=6.0.1
projectVersion=1.0.0
