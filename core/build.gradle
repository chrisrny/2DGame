// Module core : écrans, rendu, HUD et entrées, avec libGDX.
// Il lit le modèle et lui transmet les intentions du joueur ; il ne décide jamais des règles.

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api project(':model')

  // Tests des entrées (manette, aide à la visée) : du Java pur, sans fenêtre.
  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}
