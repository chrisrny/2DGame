// Module lwjgl3 : le lanceur desktop. Aucune logique de jeu ici.

plugins {
  id 'application'
}

application {
  mainClass = 'game.lwjgl3.Lwjgl3Launcher'
  applicationName = '2dgame'
}

// Les fichiers du dossier assets/ (sprites, sons, polices) sont embarqués dans le jar.
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

dependencies {
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation project(':core')

  // Force LWJGL3 en version récente pour éviter des avertissements sur les JDK récents.
  constraints {
    implementation "org.lwjgl:lwjgl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-jemalloc:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-stb:$lwjgl3Version"
  }
}

tasks.named('run') {
  // Le jeu se lance depuis assets/ pour que les chemins relatifs des fichiers fonctionnent.
  workingDir = rootProject.file('assets')
  jvmArgs += '--enable-native-access=ALL-UNNAMED'
  // macOS exige que la fenêtre soit créée sur le thread principal.
  if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
    jvmArgs += '-XstartOnFirstThread'
  }
}

// Jar exécutable contenant toutes les dépendances : ./gradlew lwjgl3:jar
tasks.named('jar') {
  archiveFileName = "2dgame-${projectVersion}.jar"
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'
  manifest {
    attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED', 'Multi-Release': 'true'
  }
}
